name: homepage-publish

on:
  push:
    branches:
      - main
    paths:
      - "홈페이지_첫버전/**"
      - ".github/workflows/homepage-publish.yml"
  schedule:
    # KST 08:20, 15:20, 18:20. 콘텐츠 발행 직후 홈페이지를 다시 생성·게시한다.
    - cron: "20 23 * * *"
    - cron: "20 6 * * *"
    - cron: "20 9 * * *"
  repository_dispatch:
    types: [daily-thesis-published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static homepage
        working-directory: 홈페이지_첫버전
        run: python 홈페이지_생성.py
      - name: Commit generated homepage
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "자동 업데이트: Hoya Bot 데일리 테제 반영"
          file_pattern: "홈페이지_첫버전/index.html"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 홈페이지_첫버전

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
